server:
  port: 8080

spring:
  application:
    name: it-support-backend
  datasource:
    url: jdbc:mysql://localhost:3306/it_support_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 10MB

app:
  jwt:
    secret: ${JWT_SECRET:ZGVza2Zsb3ctZW5zYS1mZXMtaXQtc3VwcG9ydC1zZWNyZXQta2V5LTIwMjY=}
    expiration-ms: 86400000
  cors:
    allowed-origins: http://localhost:4200
  upload:
    dir: ./uploads
